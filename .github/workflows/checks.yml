name: Application checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check scripts and deterministic behavior
        run: |
          node --check mass-rite.js
          node --check mass-scenarios.js
          node --check mass-rite-exposition.js
          node --check mass-rite-baptism.js
          node --check mass-rite-funeral.js
          node --check mass-rite-corpus.js
          node --check mass-features.js
          node --check mass-parishes.js
          node --check mass-parish-editor.js
          node --check parish-intake.js
          node --check parish-intake.cjs
          node --check parish-review.js
          node --check mass-speech.js
          node --check mass-graphics.js
          node --check mass-materials.js
          node --check mass-3d.js
          node --check mass-game-icons.js
          node --check mass-game-logic.js
          node --check mass-game-audio.js
          node --check mass-game-view.js
          node --check mass-game.js
          node --check mass-game-ui.js
          node --check mass-game-path.js
          node --check feedback-config.js
          node mass-scenarios.test.cjs
          node mass-features.test.cjs
          node mass-assets.test.cjs
          node mass-game.test.cjs
          node mass-corpus.test.cjs
